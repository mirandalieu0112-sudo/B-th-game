<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>部首冒險：VR 全息寶藏箱 | Trò chơi Bộ thủ mạo hiểm VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 科技幻夜 VR 配色 */
            --primary-color: #0088FF; 
            --secondary-color: #9933FF; 
            --bg-dark: #050510;
            --text-color: #FFFFFF;
            --danger-color: #FF3366;
            --success-color: #00FF66;
        }

        body {
            font-family: 'Mulish', 'Microsoft JhengHei', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-color);
            overflow: hidden; 
            /* VR 空間網格背景 */
            background-image: 
                linear-gradient(rgba(0, 136, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 136, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px; /* VR 3D 視角核心 */
        }

        .vr-reticle {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: rgba(255,255,255,0.5); border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 0; pointer-events: none;
            box-shadow: 0 0 10px var(--success-color);
        }

        /* VR 全息浮空面板 */
        #app {
            background: rgba(10, 10, 25, 0.6); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            width: 90%; max-width: 500px;
            border: 2px solid rgba(0, 136, 255, 0.5); 
            padding: 30px 20px;
            box-sizing: border-box;
            z-index: 10; 
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 136, 255, 0.3), inset 0 0 20px rgba(153, 51, 255, 0.2);
            /* 調整為稍微俯視的科技控制台角度 */
            transform: rotateX(8deg) translateY(-2%);
            transition: transform 0.3s ease-out;
        }

        #app:hover { transform: rotateX(0deg) translateY(0); }

        .hidden { display: none !important; }

        h1 { font-size: 26px; color: var(--success-color); margin-bottom: 5px; font-weight: 900; text-shadow: 0 0 10px rgba(0,255,102,0.5);}
        .subtitle { font-size: 15px; color: #AACCFF; margin-bottom: 20px; }

        /* 進度條與生命值 */
        .status-ui { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; border-bottom: 1px solid rgba(0, 136, 255, 0.3); padding-bottom: 15px;
        }
        
        .stage-badge { 
            background: rgba(0, 136, 255, 0.2); color: var(--primary-color); 
            padding: 5px 12px; font-weight: bold; font-size: 14px; 
            border-radius: 8px; border: 1px solid var(--primary-color); 
            text-shadow: 0 0 5px var(--primary-color);
        }

        .pixel-heart-bar { display: flex; gap: 6px; }
        .pixel-heart { font-size: 20px; line-height: 1; filter: drop-shadow(0 0 5px var(--danger-color)); }
        .pixel-heart.empty { filter: grayscale(100%) opacity(0.3); }
        
        .progress-container-adventure { display: flex; gap: 4px; justify-content: center; margin-top: 10px;}
        .pixel-progress-segment { width: 100%; height: 6px; background-color: rgba(255,255,255,0.1); border-radius: 3px;}
        .pixel-progress-segment.active { background-color: var(--secondary-color); box-shadow: 0 0 8px var(--secondary-color);}

        /* 遊戲區域 */
        .question-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: var(--primary-color); text-shadow: 0 0 5px rgba(0,136,255,0.5);}
        .question-subtitle { font-size: 14px; color: #88BBAA; margin-bottom: 10px; }
        .target-item { 
            font-size: 65px; font-weight: 900; color: #FFFFFF; 
            margin: 15px 0; text-shadow: 0 0 20px var(--primary-color), 0 0 40px var(--secondary-color); 
        }

        /* 預設通用按鈕 (開始/重玩等) */
        .btn {
            display: block; width: 100%; 
            background: rgba(10, 10, 25, 0.8); 
            border: 2px solid var(--primary-color); 
            padding: 15px; margin: 12px 0; font-size: 18px; font-family: inherit; font-weight: bold;
            color: #FFFFFF; cursor: pointer; transition: all 0.3s ease; border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.3), inset 0 0 10px rgba(0, 136, 255, 0.1);
        }
        .btn:active { transform: scale(0.96); }
        .btn:hover { background: rgba(0, 136, 255, 0.2); box-shadow: 0 0 25px rgba(0, 136, 255, 0.6); }

        /* --- 遊戲選項專屬顏色 (紅、黃、綠) --- */
        
        /* 選項 1：霓虹紅 */
        #options-container .btn:nth-child(1) {
            border-color: #FF3366;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.3), inset 0 0 10px rgba(255, 51, 102, 0.1);
        }
        #options-container .btn:nth-child(1):hover {
            background: rgba(255, 51, 102, 0.2);
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.6), inset 0 0 15px rgba(255, 51, 102, 0.3);
            text-shadow: 0 0 8px #FF3366;
        }

        /* 選項 2：星芒黃 */
        #options-container .btn:nth-child(2) {
            border-color: #FFCC00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3), inset 0 0 10px rgba(255, 204, 0, 0.1);
        }
        #options-container .btn:nth-child(2):hover {
            background: rgba(255, 204, 0, 0.2);
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.6), inset 0 0 15px rgba(255, 204, 0, 0.3);
            text-shadow: 0 0 8px #FFCC00;
        }

        /* 選項 3：量子綠 */
        #options-container .btn:nth-child(3) {
            border-color: #00FF66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3), inset 0 0 10px rgba(0, 255, 102, 0.1);
        }
        #options-container .btn:nth-child(3):hover {
            background: rgba(0, 255, 102, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.6), inset 0 0 15px rgba(0, 255, 102, 0.3);
            text-shadow: 0 0 8px #00FF66;
        }
        /* --------------------------------- */
        
        /* 回饋彈跳視窗 */
        #feedback-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.85); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid var(--primary-color); z-index: 100; box-sizing: border-box; padding: 20px;
            border-radius: 15px;
        }
        .feedback-icon { font-size: 70px; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));}
        .feedback-text-zh { font-size: 26px; font-weight: bold; margin-bottom: 5px; color: var(--success-color); text-shadow: 0 0 10px var(--success-color);}
        .feedback-text-vn { font-size: 18px; color: #AACCFF; margin-bottom: 25px; }
        .next-btn { border-color: var(--primary-color); width: 90%; }
        
    </style>
</head>

    let audioCtx;
    function initAudio() {
        if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    }
    function playTone(freq, type, duration, vol = 0.1) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    function playCorrectSound() { initAudio(); playTone(987.77, 'sine', 0.1, 0.1); setTimeout(() => playTone(1318.51, 'sine', 0.2, 0.1), 100); }

            { target: "「艦艇」🚢", options: ["Thuyền (舟) ⛵", "Chim (隹) 🐦", "Hang động (穴) 🕳️"], answer: 0 },
            { target: "「蜘蛛」🕷️", options: ["Côn trùng (虫) 🐛", "Thú dữ (豸) 🐆", "Chim (隹) 🐦"], answer: 0 },
            { target: "「詞語」💬", options: ["Lời nói (言) 🗣️", "Tiền bạc (貝) 💰", "Bước đi (辶) 🚶"], answer: 0 },
            { target: "「財富」💎", options: ["Tiền bạc (貝) 💰", "Làng mạc (邑) 🏘️", "Quần áo (衣) 👕"], answer: 0 },
            { target: "「鋼鐵」⚙️", options: ["Kim loại (金) 🪙", "Gỗ (木) 🌳", "Rượu (酉) 🍷"], answer: 0 },
            { target: "「閱讀」📖", options: ["Ngôn ngữ (言) 🗣️", "Cửa (門) 🚪", "Thức ăn (食) 🍚"], answer: 0 },
            { target: "「餐廳」🍴", options: ["Ăn uống (食) 🍽️", "Mái nhà (宀) 🏠", "Đánh khẽ (支) 🏑"], answer: 0 },
            { target: "「悲傷」😢", options: ["Cảm xúc (心) ❤️", "Bệnh tật (疒) 🤒", "Lực/Sức (力) 💪"], answer: 0 },
            { target: "「擁抱」🫂", options: ["Tay/Hành động (手) ✋", "Bước chân (彳) 🚶", "Cơ thể (肉) 🥩"], answer: 0 },
            { target: "「宇宙」🌌", options: ["Không gian (宀) 🏠", "Bát đĩa (皿) 🥣", "Hang (穴) 🕳️"], answer: 0 },
            { target: "「稻麥」🌾", options: ["Cây trồng (禾) 🌾", "Gạo (米) 🍚", "Cây gai (麻) 🌿"], answer: 0 },
            { target: "「肌膚」💆", options: ["Cơ thể (肉) 🥩", "Lông/Tóc (髟) 💇", "Quần áo (衣) 👕"], answer: 0 },
            { target: "「飛禽」🦅", options: ["Chim (隹) 🐦", "Chó (犬) 🐕", "Hổ (虍) 🐯"], answer: 0 }
        ]
    };

    const difficultyTitles = {
        1: { zh: "SYSTEM.STAGE_1 [基礎辨識]", vn: "Hệ thống: Màn 1 [Nhận biết]" },
        2: { zh: "SYSTEM.STAGE_2 [結構掃描]", vn: "Hệ thống: Màn 2 [Quét cấu trúc]" },
        3: { zh: "SYSTEM.STAGE_3 [部件重組]", vn: "Hệ thống: Màn 3 [Tái tổ hợp]" },
        4: { zh: "SYSTEM.STAGE_4 [陷阱排除]", vn: "Hệ thống: Màn 4 [Loại bỏ bẫy]" },
        5: { zh: "SYSTEM.STAGE_5 [語義推論]", vn: "Hệ thống: Màn 5 [Suy luận]" }
    };

    const QUESTIONS_PER_LEVEL = 10; 
    const TOTAL_LEVELS = 5;
    const MAX_HEALTH = 5;

    let currentLevel = 1; 
    let questionsAnsweredInLevel = 0;
    let totalCorrectCount = 0;
    let currentHealth = MAX_HEALTH;
    let currentLevelQuestions = []; 

    function startGame() {
        initAudio(); 
        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-game").classList.remove("hidden");
        
        const progressContainer = document.getElementById("progress-container-adventure");
        progressContainer.innerHTML = "";
        for (let i = 0; i < QUESTIONS_PER_LEVEL; i++) {
            const segment = document.createElement("div");
            segment.className = "pixel-progress-segment";
            segment.id = `progress-segment-${i}`;
            progressContainer.appendChild(segment);
        }
        
        prepareLevel();
    }

    function prepareLevel() {
        questionsAnsweredInLevel = 0;
        let pool = [...questionBank[currentLevel]];
        pool.sort(() => Math.random() - 0.5); 
        currentLevelQuestions = pool.slice(0, QUESTIONS_PER_LEVEL); 
        
        updatePixelUI();
        loadNextQuestion();
    }

    function updatePixelUI() {
        document.getElementById("stage-badge").innerText = `訓練進度 ${currentLevel} / ${TOTAL_LEVELS}`;
        
        for (let i = 1; i <= MAX_HEALTH; i++) {
            const heart = document.getElementById(`heart-${i}`);
            if (i <= currentHealth) {
                heart.classList.remove("empty");
            } else {
                heart.classList.add("empty");
            }
        }
        
        for (let i = 0; i < QUESTIONS_PER_LEVEL; i++) {
            const segment = document.getElementById(`progress-segment-${i}`);
            if (i < questionsAnsweredInLevel) {
                segment.classList.add("active");
            } else {
                segment.classList.remove("active");
            }
        }
    }

    function loadNextQuestion() {
        updatePixelUI();
        const currentQ = currentLevelQuestions[questionsAnsweredInLevel];

        document.getElementById("q-title-zh").innerText = difficultyTitles[currentLevel].zh;
        document.getElementById("q-title-vn").innerText = difficultyTitles[currentLevel].vn;
        document.getElementById("q-target").innerText = currentQ.target;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        currentQ.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(index, currentQ.answer);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, correctIndex) {
        if (selectedIndex === correctIndex) {
            totalCorrectCount++;
            questionsAnsweredInLevel++;
            
            if (questionsAnsweredInLevel >= QUESTIONS_PER_LEVEL) {
                playLevelUpSound(); 
                if (currentLevel === TOTAL_LEVELS) {
                    showFeedback(true, "數據同步完成！🎉", "Đồng bộ dữ liệu hoàn tất!");
                } else {
                    showFeedback(true, "階段完成！系統修復💖", "Qua màn! Phục hồi hệ thống!");
                }
            } else {
                playCorrectSound(); 
                showFeedback(true, "解析正確！ 🌟", "Phân tích chính xác! ✨");
            }
        } else {
            playWrongSound(); 
            currentHealth--;
            
            if (currentHealth <= 0) {
                setTimeout(gameOver, 800); 
                return;
            }
            showFeedback(false, "解析錯誤！核心受損", "Phân tích sai! Lõi bị hỏng");
        }
    }

    function showFeedback(isSuccess, textZh, textVn) {
        const modal = document.getElementById("feedback-modal");
        const icon = document.getElementById("fb-icon");
        const btn = document.getElementById("fb-btn");
        
        modal.classList.remove("hidden");
        document.getElementById("fb-zh").innerText = textZh;
        document.getElementById("fb-vn").innerText = textVn;

        if (isSuccess) {
            icon.innerText = "✅";
            document.getElementById("fb-zh").style.color = "var(--success-color)";
            document.getElementById("fb-zh").style.textShadow = "0 0 10px var(--success-color)";
        } else {
            icon.innerText = "⚠️";
            document.getElementById("fb-zh").style.color = "var(--danger-color)";
            document.getElementById("fb-zh").style.textShadow = "0 0 10px var(--danger-color)";
        }
    }

    function closeFeedback() {
        document.getElementById("feedback-modal").classList.add("hidden");
        
        if (questionsAnsweredInLevel >= QUESTIONS_PER_LEVEL) {
            currentLevel++;
            if (currentLevel > TOTAL_LEVELS) {
                endGame();
            } else {
                currentHealth = MAX_HEALTH; 
                prepareLevel(); 
            }
        } else {
            loadNextQuestion();
        }
    }

    function gameOver() {
        document.getElementById("feedback-modal").classList.add("hidden");
        document.getElementById("screen-game").classList.add("hidden");
        document.getElementById("screen-gameover").classList.remove("hidden");
    }

    function endGame() {
        playLevelUpSound(); 
        document.getElementById("screen-game").classList.add("hidden");
        document.getElementById("screen-end").classList.remove("hidden");
        document.getElementById("final-score").innerText = `總答對: ${totalCorrectCount} / 50`;
    }
</script>

</body>
</html>
